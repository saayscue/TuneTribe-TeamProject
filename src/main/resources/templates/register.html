<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Register - Tune Tribe</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous" />

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .register-title {
            text-align: center;
            font-size: 32px;
            font-family: cursive;
            margin-bottom: 30px;
        }

        .form-control {
            border: none;
            border-bottom: 2px solid black;
            border-radius: 0;
            background: none;
            margin: 22px 0;
        }

        .form-control:focus {
            box-shadow: none;
            border-bottom: 2px solid black;
        }

        select.form-control {
            border-bottom: 2px solid black;
        }

        .register-btn {
            height: 45px;
            width: 100%;
            background-color: lightblue;
            color: gray;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .register-btn:hover {
            opacity: 0.85;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="card register-card">

    <div class="register-title">Tune Tribe Register</div>

    <form th:action="@{/register}" method="post">

        <input type="text"
               class="form-control"
               id="firstname"
               name="userFName"
               placeholder="Enter first name"
               required />

        <input type="text"
               class="form-control"
               id="lastname"
               name="userLName"
               placeholder="Enter last name"
               required />

        <input type="text"
               class="form-control"
               id="username"
               name="userName"
               placeholder="Enter username"
               required />

        <input type="password"
               class="form-control"
               id="password"
               name="userPassword"
               placeholder="Enter password"
               required />

        <input type="email"
               class="form-control"
               id="email"
               name="userEmail"
               placeholder="Enter email"
               required />

        <select class="form-control"
                id="role"
                name="role"
                required>
            <option value="">Select User Type</option>
            <option value="User">User</option>
            <option value="Artist">Artist</option>
        </select>

        <button class="register-btn" type="submit">
            Register
        </button>

    </form>

    <div class="login-text">
        Already have an account?
        <a href="/login">Login here</a>.
    </div>

</div>

</body>
</html>
