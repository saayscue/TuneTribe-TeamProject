<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>Profile</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous" />

        <link rel="stylesheet" href="/app-theme.css" />

    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            color: #2c3e50;
        }

        .profile-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 30px;
        }

        .profile-title {
            text-align: center;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            margin: 0 auto 20px auto;
        }

        .info-label {
            font-size: 13px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .divider {
            height: 1px;
            background-color: #eaecef;
            margin: 15px 0;
        }
    </style>

</head>

<body>

<div class="profile-wrapper">

    <div class="card profile-card">

        <h4 class="profile-title">User Profile</h4>

        <!-- Avatar using first letter of username -->
        <div class="profile-avatar"
             th:text="${#strings.substring(user.userName,0,1).toUpperCase()}">
        </div>

        <div>
            <div class="info-label">User ID</div>
            <div class="info-value" th:text="${user.id}"></div>

            <div class="divider"></div>

            <div class="info-label">Username</div>
            <div class="info-value" th:text="${user.userName}"></div>

            <div class="divider"></div>

            <div class="info-label">Email</div>
            <div class="info-value" th:text="${user.userEmail}"></div>

            <div class="divider"></div>

            <div class="info-label">Status</div>
            <div class="info-value" th:text="${user.banned ? 'Banned' : 'Active'}"></div>

            <div class="divider"></div>

            <div>
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-outline-primary btn-sm">
                    View Public Profile
                </a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
