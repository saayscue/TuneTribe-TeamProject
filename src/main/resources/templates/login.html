<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Tune Tribe Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous" />

        <link rel="stylesheet" href="/app-theme.css" />

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .login-title {
            text-align: center;
            font-size: 32px;
            font-family: cursive;
            margin-bottom: 30px;
        }

        .form-control {
            border: none;
            border-bottom: 2px solid black;
            border-radius: 0;
            background: none;
            margin: 25px 0;
        }

        .form-control:focus {
            box-shadow: none;
            border-bottom: 2px solid black;
        }

        .login-btn {
            height: 45px;
            width: 100%;
            background-color: lightblue;
            color: gray;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            transition: 0.3s ease;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        .alert-custom-error {
            background-color: lightcoral;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
        }

        .alert-custom-success {
            background-color: lightgreen;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="card login-card">

    <div th:if="${param.error}" class="alert-custom-error">
        Invalid username and/or password.
    </div>

    <div th:if="${param.logout}" class="alert-custom-success">
        You have successfully logged out.
    </div>

    <div class="login-title">Tune Tribe Login</div>

    <form th:action="@{/login}" method="post">

        <input type="text"
               class="form-control"
               id="username"
               name="username"
               placeholder="Enter username"
               required />

        <input type="password"
               class="form-control"
               id="password"
               name="password"
               placeholder="Enter password"
               required />

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <div class="register-text">
        Don't have an account?
        <a href="/register">Register here</a>.
    </div>

</div>

</body>
</html>
