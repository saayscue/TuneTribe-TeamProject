<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tune Tribe</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous" />

    <link rel="stylesheet" href="/app-theme.css" />

    <style>
        body {
            background: var(--bg);
            font-family: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            color: var(--text);
        }

        .sidenav {
            height: 100vh;
            width: 240px;
            position: fixed;
            left: 0;
            top: 0;
            background: var(--bg);
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-right: 1px solid var(--border);
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 999px;
            background: transparent;
            transition: 0.2s ease;
            font-size: 16px;
            font-weight: 600;
        }

        .nav-links a:hover {
            background: #161e2a;
        }

        .logout-form {
            margin-top: auto;
            padding: 20px;
        }

        .logout-btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #051522;
            font-weight: 700;
            transition: 0.2s ease;
            box-shadow: 0 10px 20px rgba(33, 167, 241, 0.25);
        }

        .logout-btn:hover {
            background: var(--accent-strong);
        }

        .main-content {
            margin-left: 240px;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .content-card {
            width: 100%;
            max-width: 900px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
        }

        .page-title {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .posted-text {
            font-size: 16px;
            color: var(--muted);
            line-height: 1.7;
            white-space: pre-line;
            text-align: left;
        }
    </style>
</head>

<body>

<nav class="sidenav">
    <div class="brand">TuneTribe Admin</div>
     <div class="nav-links"> 
          <a href="/">Home</a>
        <a th:href="@{/admin/home}">Dashboard</a>
        <a href="/admin/tunetribe-guidelines">Community Guidelines</a>
        <a href="/admin/tunetribe-copyright">Copyright Rules</a>
    </div>
    <form th:action="@{/logout}" method="post" class="logout-form">
        <button class="logout-btn" type="submit">Log Out</button>
    </form>
</nav>

<div class="main-content">
    <div class="content-card">
        <h1 class="page-title">Tune Tribe</h1>
        <div>
            <p class="posted-text" th:text="${text}"></p>
        </div>
    </div>
</div>

</body>
</html>
